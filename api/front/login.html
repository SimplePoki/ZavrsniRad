<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<title>Prijava — Dom evidencija njege</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #f1f5f9;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card {
    width: 380px;
    background: #ffffff;
    border-radius: 14px;
    box-shadow: 0 1px 3px rgba(15,23,42,0.08), 0 8px 24px rgba(15,23,42,0.06);
    padding: 40px 36px;
  }
  .logo {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 28px;
  }
  .logo-icon {
    width: 44px;
    height: 44px;
    border-radius: 12px;
    background: #eff6ff;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 14px;
  }
  .logo h1 {
    font-size: 19px;
    margin: 0;
    color: #0f172a;
  }
  .logo p {
    font-size: 13px;
    color: #64748b;
    margin: 4px 0 0;
  }
  label {
    display: block;
    font-size: 12.5px;
    font-weight: 600;
    color: #334155;
    margin-bottom: 6px;
  }
  input {
    width: 100%;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 13.5px;
    margin-bottom: 16px;
    font-family: inherit;
  }
  input:focus {
    outline: 2px solid #2563eb;
    outline-offset: 1px;
  }
  button {
    width: 100%;
    background: #2563eb;
    color: #ffffff;
    border: none;
    font-size: 14px;
    font-weight: 600;
    padding: 12px;
    border-radius: 8px;
    cursor: pointer;
    font-family: inherit;
  }
  button:hover {
    background: #1d4ed8;
  }
  .note {
    font-size: 11.5px;
    color: #94a3b8;
    text-align: center;
    margin-top: 18px;
    font-style: italic;
  }
</style>
</head>
<body>

<div class="card">
  <div class="logo">
    <div class="logo-icon">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 11l9-8 9 8"/>
        <path d="M5 10v10h14V10"/>
        <path d="M9 20v-6h6v6"/>
      </svg>
    </div>
    <h1>Dom &middot; Evidencija njege</h1>
    <p>Prijava u sustav za osoblje</p>
  </div>

  <form id="loginForm">
    <label for="email">Email</label>
    <input type="email" id="email" placeholder="ime.prezime@dom.test" required>

    <label for="lozinka">Lozinka</label>
    <input type="password" id="lozinka" placeholder="••••••••" required>

    <button type="submit">Prijava</button>
  </form>

  <div id="status" style="text-align:center; font-size:13px; margin-top:14px;"></div>


  <div class="note">Pristup samo za zaposlenike doma</div>
</div>

<script>
document.getElementById('loginForm').addEventListener('submit', async function (e) {
    e.preventDefault();

    const email = document.getElementById('email').value;
    const lozinka = document.getElementById('lozinka').value;
    const status = document.getElementById('status');

    const response = await fetch('../auth/login.php', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        },
        credentials: 'include',
        body: JSON.stringify({ email: email, lozinka: lozinka })
    });

    const data = await response.json();

    if (response.ok) {
        window.location.href = 'index.html';
    } else {
        status.style.color = '#dc2626';
        status.textContent = data.error;
    }
});
</script>


</body>
</html>
